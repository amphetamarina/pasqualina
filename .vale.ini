# Vale configuration for Pasqualina.
# The server runs: vale --config .vale.ini --no-global --output=JSON --no-exit --ext=.txt
# (stdin, plain-text format). See docs/02-vale.md for how rules are written.

StylesPath = styles
MinAlertLevel = suggestion

# Accept/reject word lists live in styles/config/vocabularies/Pasqualina/
Vocab = Pasqualina

[*]
BasedOnStyles = Vale, BR

# Harper already spell-checks; Vale's own spelling check would double-report.
Vale.Spelling = NO

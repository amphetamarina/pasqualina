<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasqualina</title>
<style>
  :root {
    --bg: #faf8f4; --panel: #fff; --ink: #1f1d1a; --muted: #6b665e; --line: #e2ddd3;
    --harper: #2f6fde; --vale: #c2571b;
    --err: #c62828; --warn: #b7791f; --sug: #3b7dd8;
    --mark-err: rgba(198,40,40,.16); --mark-warn: rgba(183,121,31,.18); --mark-sug: rgba(59,125,216,.14);
    --font: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 var(--font); color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  select, button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  #status { font-size: 13px; color: var(--muted); min-width: 220px; text-align: right; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 0; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

  /* editor: transparent textarea over a backdrop that carries the highlights */
  #editor { position: relative; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
  #backdrop, #text {
    position: absolute; inset: 0; margin: 0; padding: 22px 26px;
    font: 16px/1.65 var(--font); letter-spacing: normal; word-spacing: normal;
    white-space: pre-wrap; overflow-wrap: break-word; overflow-y: auto; tab-size: 4;
  }
  #backdrop { color: transparent; pointer-events: none; }
  #text { background: transparent; color: var(--ink); border: 0; outline: 0; resize: none; caret-color: var(--ink); }
  #text::placeholder { color: #b5afa4; }
  mark { color: transparent; background: transparent; border-radius: 2px; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  mark.error { background: var(--mark-err); text-decoration: underline wavy var(--err); }
  mark.warning { background: var(--mark-warn); text-decoration: underline wavy var(--warn); }
  mark.suggestion { background: var(--mark-sug); text-decoration: underline dotted var(--sug); }
  mark.active { outline: 2px solid var(--ink); outline-offset: 1px; }

  /* issues panel */
  #issues { overflow-y: auto; padding: 14px 16px; background: var(--bg); }
  #issues .empty { color: var(--muted); padding: 24px 6px; }
  .issue { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .issue.error { border-left-color: var(--err); } .issue.suggestion { border-left-color: var(--sug); }
  .issue.active { box-shadow: 0 0 0 2px var(--ink); }
  .issue .meta { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .tool { font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; padding: 1px 6px; border-radius: 4px; color: #fff; }
  .tool.harper { background: var(--harper); } .tool.vale { background: var(--vale); }
  .issue .matched { font-family: var(--mono); font-size: 13px; background: #f3efe7; padding: 0 4px; border-radius: 3px; }
  .issue .msg { margin: 2px 0 6px; }
  .issue .fix { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 13px; cursor: pointer; }
  .issue .fix:hover { border-color: var(--ink); }
  .issue a { color: var(--muted); font-size: 12px; }
  .summary { font-size: 13px; color: var(--muted); margin: 0 0 12px; display: flex; gap: 14px; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>Pasqualina <small>English, checked by Harper and Vale</small></h1>
  <div class="spacer"></div>
  <label><input type="checkbox" id="auto" checked> check as I type</label>
  <button class="primary" id="check" title="Ctrl+Enter">Check</button>
  <div id="status">idle</div>
</header>
<main>
  <section id="editor">
    <div id="backdrop" aria-hidden="true"></div>
    <textarea id="text" spellcheck="false" placeholder="Type or paste English here. Harper checks spelling and grammar; Vale looks for the mistakes Brazilians typically make."></textarea>
  </section>
  <aside id="issues"><div class="empty">Nothing checked yet. Start typing, or press <kbd>Ctrl</kbd>+<kbd>Enter</kbd>.</div></aside>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const text = $("#text"), backdrop = $("#backdrop"), issuesEl = $("#issues"), status = $("#status");
  const auto = $("#auto"), checkBtn = $("#check");
  let issues = [], activeId = null, timer = null, inflight = null, lastText = null;

  // ---- persistence (per browser; nothing leaves the machine)
  try {
    text.value = localStorage.getItem("pasqualina.text") ?? "";
    auto.checked = (localStorage.getItem("pasqualina.auto") ?? "1") === "1";
  } catch {}
  const save = () => { try {
    localStorage.setItem("pasqualina.text", text.value);
    localStorage.setItem("pasqualina.auto", auto.checked ? "1" : "0");
  } catch {} };

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const rank = { error: 3, warning: 2, suggestion: 1 };

  // ---- highlight backdrop. Issues can overlap, so cut the text at every
  // boundary and wrap each segment with the strongest severity covering it.
  function renderBackdrop() {
    const src = text.value;
    const cuts = new Set([0, src.length]);
    for (const i of issues) { cuts.add(i.start); cuts.add(i.end); }
    const points = [...cuts].sort((a, b) => a - b);
    let html = "";
    for (let k = 0; k < points.length - 1; k++) {
      const a = points[k], b = points[k + 1];
      const covering = issues.filter((i) => i.start <= a && i.end >= b);
      const seg = esc(src.slice(a, b));
      if (!covering.length) { html += seg; continue; }
      const top = covering.reduce((m, i) => rank[i.severity] > rank[m.severity] ? i : m);
      const active = covering.some((i) => i.id === activeId) ? " active" : "";
      html += `<mark class="${top.severity}${active}">${seg}</mark>`;
    }
    backdrop.innerHTML = html + "\n"; // trailing newline keeps heights in sync
    backdrop.scrollTop = text.scrollTop;
  }
  text.addEventListener("scroll", () => { backdrop.scrollTop = text.scrollTop; backdrop.scrollLeft = text.scrollLeft; });

  // ---- issues panel
  function renderIssues(meta) {
    if (!issues.length) {
      issuesEl.innerHTML = `<div class="empty">${lastText === null ? "Nothing checked yet." : "No issues found."}</div>`;
      return;
    }
    const counts = meta ?? {};
    let html = `<p class="summary"><span><span class="tool harper">harper</span> ${counts.harper ?? 0}</span><span><span class="tool vale">vale</span> ${counts.vale ?? 0}</span></p>`;
    for (const i of issues) {
      const fixes = i.suggestions.map((s, n) =>
        `<button class="fix" data-id="${i.id}" data-n="${n}">${s === "" ? "remove" : esc(s)}</button>`).join("");
      const link = i.link ? ` <a href="${esc(i.link)}" target="_blank" rel="noopener">more</a>` : "";
      html += `<div class="issue ${i.severity}${i.id === activeId ? " active" : ""}" data-id="${i.id}">
        <div class="meta"><span class="tool ${i.tool}">${i.tool}</span><span>${esc(i.rule)}</span><span>· line ${i.line}</span></div>
        <div class="msg">${esc(i.message)}${link}</div>
        <span class="matched">${esc(i.matched)}</span> ${fixes}
      </div>`;
    }
    issuesEl.innerHTML = html;
  }
  issuesEl.addEventListener("click", (e) => {
    const fix = e.target.closest(".fix");
    if (fix) { applyFix(Number(fix.dataset.id), Number(fix.dataset.n)); return; }
    const card = e.target.closest(".issue");
    if (card) focusIssue(Number(card.dataset.id));
  });
  function focusIssue(id) {
    const i = issues.find((x) => x.id === id); if (!i) return;
    activeId = id;
    text.focus(); text.setSelectionRange(i.start, i.end);
    renderBackdrop(); renderIssues(lastMeta);
    issuesEl.querySelector(`.issue[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
    // scroll the textarea so the selection is visible: mirror the mark's offset
    const m = backdrop.querySelector("mark.active");
    if (m) text.scrollTop = Math.max(0, m.offsetTop - text.clientHeight / 2);
  }
  function applyFix(id, n) {
    const i = issues.find((x) => x.id === id); if (!i) return;
    const rep = i.suggestions[n];
    text.setRangeText(rep, i.start, i.end, "end");
    const delta = rep.length - (i.end - i.start);
    issues = issues.filter((x) => x.id !== id && !(x.start < i.end && x.end > i.start))
      .map((x) => x.start >= i.end ? { ...x, start: x.start + delta, end: x.end + delta } : x);
    activeId = null; save(); renderBackdrop(); renderIssues(lastMeta); schedule();
  }

  // caret movement highlights the issue under the caret
  function syncActiveToCaret() {
    const pos = text.selectionStart;
    const hit = issues.find((i) => i.start <= pos && pos <= i.end);
    const id = hit ? hit.id : null;
    if (id !== activeId) { activeId = id; renderBackdrop(); renderIssues(lastMeta);
      if (id !== null) issuesEl.querySelector(`.issue[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" }); }
  }
  text.addEventListener("click", syncActiveToCaret);
  text.addEventListener("keyup", (e) => { if (e.key.startsWith("Arrow") || e.key === "Home" || e.key === "End") syncActiveToCaret(); });

  // ---- linting
  let lastMeta = null;
  async function check() {
    const value = text.value;
    if (inflight) inflight.abort();
    if (!value.trim()) { issues = []; lastText = value; lastMeta = null; renderBackdrop(); renderIssues(); status.textContent = "idle"; return; }
    const ctrl = new AbortController(); inflight = ctrl;
    status.textContent = "checking…"; checkBtn.disabled = true;
    try {
      const r = await fetch("/api/lint", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: value }), signal: ctrl.signal });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error ?? r.statusText);
      if (text.value !== value) return; // typed meanwhile; a new check is scheduled
      issues = data.issues.map((i, n) => ({ ...i, id: n }));
      lastText = value; lastMeta = data.counts; activeId = null;
      renderBackdrop(); renderIssues(data.counts);
      status.textContent = `${issues.length} issue${issues.length === 1 ? "" : "s"} · ${data.ms} ms`;
    } catch (e) {
      if (e.name === "AbortError") return;
      status.textContent = "error: " + e.message;
    } finally { if (inflight === ctrl) { inflight = null; checkBtn.disabled = false; } }
  }
  function schedule() {
    clearTimeout(timer);
    if (!auto.checked) return;
    timer = setTimeout(check, 700);
  }
  text.addEventListener("input", () => {
    // keep highlights roughly in place while typing: drop the ones that
    // no longer match their text, shift is not tracked (a fresh check follows)
    const v = text.value;
    issues = issues.filter((i) => v.slice(i.start, i.end) === i.matched);
    renderBackdrop(); save(); schedule();
  });
  auto.addEventListener("change", () => { save(); if (auto.checked) schedule(); });
  checkBtn.addEventListener("click", check);
  document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); check(); } });

  renderBackdrop();
  if (text.value.trim()) check();
})();
</script>
</body>
</html>

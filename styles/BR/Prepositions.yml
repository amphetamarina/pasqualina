# Prepositions copied from Portuguese. Harper 2.3.0 covers "arrive to",
# "discuss about", "since + duration", "good in" and a few others (ArriveTo,
# Discuss, SinceDuration, GoodAt, DespiteOf…), so they are not repeated here.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: substitution
message: "Use '%s' rather than '%s' (the Portuguese preposition does not carry over)."
level: warning
ignorecase: true
action:
  name: replace
swap:
  '(depend|depends|depended|depending) (of|from|in)': '$1 on'
  '(it''s|it is|that''s|that is|this is|everything is|all is|which is|it was|that was|this was) depend': '$1 depends (it depends on…)'
  '(married|marry|marries|marrying|engaged) with': '$1 to'
  '(enter|enters|entered|entering) in (the|a|an|this|that|my|your|his|her|their|our|some|any|each|every|one|another)': '$1 $2'
  '(answered|answering|please answer|to answer|can answer|could answer|will answer|would answer|must answer|should answer|need to answer|have to answer|has to answer|had to answer|didn''t answer|did not answer|don''t answer|do not answer|doesn''t answer|does not answer|never answer|always answer) to (the|a|an|this|that|my|your|his|her|their|our|these|those|all the|every|each|some|any) (question|questions|email|emails|e-mail|e-mails|message|messages|letter|letters|comment|comments|request|requests|survey|form|complaint|complaints|inquiry|query|queries|ticket|tickets|post|posts|review|reviews|questionnaire|poll|invitation|invitations)': '$1 $2 $3'
  '(in|at) the (internet|tv|television|radio)': 'on the $2'
  '(in|at) (monday|tuesday|wednesday|thursday|friday|saturday|sunday|mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays|weekdays|weekends|the weekend|the weekends|christmas day|new year''s day|my birthday|your birthday|his birthday|her birthday|that day|this day|the first day|the last day|the next day|the following day|the same day|a rainy day|a sunny day|a cold day|a hot day|a beautiful day|the morning of|the afternoon of|the evening of|the night of)': 'on $2'
  '(in|on|at) the next (week|month|year|semester|quarter|decade|weekend|monday|tuesday|wednesday|thursday|friday|saturday|sunday|summer|winter|spring|autumn|fall|holidays|vacation|vacations|term|sprint|release|iteration|cycle)': 'next $2 (no preposition)'
  '(think|thinks|thought|thinking) (in|on) (you|him|her|them|me|us|someone|somebody|something|everything|nothing|anything|everyone|everybody|anyone|anybody|nobody|no one|the future|the past|the problem|the answer|the solution|the question|the idea|the plan|the project|the exam|the test|the meeting|the trip|the party|the weekend|the holidays|the vacation)': '$1 about $3'
  '(dream|dreams|dreamed|dreamt|dreaming) with': '$1 about/of'
  '(different|differently|differ|differs|differed|differing|distinct) of': '$1 from'
  '(go|goes|went|going|come|comes|came|coming|arrive|arrives|arrived|arriving|get|gets|got|getting|return|returns|returned|returning|be back|back|straight|directly|walk|walks|walked|walking|drive|drives|drove|driving|run|runs|ran|running|head|heads|headed|heading) (to|at|in|into) home': '$1 home'
  'in this moment': 'right now / at the moment'
  '(in|at) the (moment|second|instant) (that|when|in which)': 'the $2 $3'
  'in the (end|beginning|middle) of the (day|night|morning|afternoon|evening|week|month|year|semester|season|game|match|movie|film|book|story|meeting|class|lesson|lecture|course|project|trip|road|street|line|list|page|paragraph|sentence|text|chapter|episode|show|series|process|period|term|shift|session|call|conversation|interview|presentation|speech|talk|ceremony|party|event|century|decade|century|life|career|contract|trial|test|exam|report|document|file|email|message|letter|essay|article|paper|thesis|novel|song|video|program|programme|schedule|agenda|plan|route|path|tunnel|bridge|corridor|hall|hallway|aisle|row|queue)': 'at the $1 of the $2'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to (do|be|go|see|find|work|study|learn|teach|travel|buy|sell|pay|win|grow|build|read|speak|talk|say|tell|ask|answer|help|start|finish|try|play|watch|listen|meet|know|understand|think|feel|want|need|avoid|fix|develop|participate|join|stay|return|open|walk|fly|cook|eat|drink|sleep|rest|relax|train|compete|succeed|fail|protect|search)': '$1 of $2ing'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to (mak|hav|com|tak|giv|us|liv|los|chang|improv|creat|writ|continu|lov|lik|choos|decid|solv|reduc|increas|leav|mov|clos|driv|exercis|sav)e': '$1 of $2ing'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to (design|test|check|verify|lead|follow|offer|deliver|send|accept|reject|allow|cancel|delay|wait|expect|book|order|spend|invest|earn|afford|connect|add|repeat|copy|print|upload|download|install|debug|program|deploy)': '$1 of $2ing'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to (explor|measur|compar|analyz|evaluat|describ|defin|organiz|manag|provid|receiv|refus|approv|postpon|prepar|schedul|reserv|wast|shar|remov|includ|replac|updat|configur|upgrad|cod|delet|arrang)e': '$1 of $2ing'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to die': '$1 of dying'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to lie': '$1 of lying'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to tie': '$1 of tying'
  '(in|at) the nights?(?!\s+(?:sky|air|of|before|shift|shifts|market|life)\b)': 'at night'
  'at the (morning|afternoon|evening)': 'in the $1'
  'in (christmas|easter|new year|carnival|carnaval|halloween)': 'at $1'
  'in the (bus|plane|airplane|train|ship|bike|bicycle|motorcycle|subway|metro|tram|ferry)': 'on the $1'
  'on the (picture|photo|photograph|image|painting|drawing)': 'in the $1'
  'in the (phone|telephone|cellphone|screen|website|site|map|shelf|first floor|second floor|third floor|ground floor|top floor|left|right)': 'on the $1'
  '(in|on) the age of (\d+|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)': 'at the age of $2'
  'in the year of (\d{4})': 'in $1'
  'during (\d+|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|many|several|some|a few) (seconds|minutes|hours|days|weeks|months|years|decades)': 'for $1 $2'
  'by (example|instance)': 'for example'
  'by the other side(?!\s+of\b)': 'on the other hand'
  'by one side(?!\s+of\b)': 'on one hand'
  'by (this|that|the same) (reason|motive)': 'for $1 reason'
  'by (the )?(first|second|third|last) time': 'for the $2 time'
  'by (the )?contrary': 'on the contrary'
  '(to|by) the least': 'at least'
  'of (sudden|repent)': 'suddenly'
  '(has|have|had|having) (nothing |something |anything |a lot |much |everything |all )?to see with': '$1 $2to do with'
  '(count|counts|counted|counting) with': '$1 on'
  'in home(?![ -]\w)': 'at home'
  'in this night': 'tonight'
  'in (this|that) (morning|afternoon|evening|week|month|year)': '$1 $2'
  'in first place': 'first'
  'in special': 'especially'
  'to the long of': 'along'
  'leave (it )?with me': 'leave it to me'
  'with (\d+) years( old)? (I|he|she|we|they|you)': 'at $1 $3'
  'for (\d+|two|three|four|five|ten|twenty) (days|weeks|months|years) ago': '$1 $2 ago'
  '(possibility|possibilities|intention|intentions|habit|habits|risk|risks|fear|fears|advantage|advantages|disadvantage|disadvantages|importance|necessity|purpose|cost|costs|experience|experiences|pleasure|honor|honour|privilege|art|business|point|question|problem|idea|ideas|hope|hopes) to (sto|ru|ge|si|pu|cu|pla|sho|swi|wi|begi|refe|prefe|admi|commi|forge|dro|cha|jo|hi|qui|se|le|be|fi|di|hu|gra|no|wra|sti|spo|ski|sli|ste|tri|plu|ho)(p|n|t|m|r|g|b|d)': '$1 of $2$3$3ing'

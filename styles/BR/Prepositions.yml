# Prepositions copied from Portuguese. Harper 2.3.0 covers "arrive to",
# "discuss about", "since + duration", "good in" and a few others (ArriveTo,
# Discuss, SinceDuration, GoodAt, DespiteOf…), so they are not repeated here.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: substitution
message: "Use '%s' rather than '%s' (the Portuguese preposition does not carry over)."
level: warning
ignorecase: true
action:

# Relative-pronoun calques (a pessoa que -> the person who). Exact fixes only.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: substitution
message: "English says '%s', not '%s' (relative pronoun)."
level: warning
ignorecase: true
action:
  name: replace
swap:

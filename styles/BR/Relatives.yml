  '(author|authors|writer|writers|artist|artists|singer|singers|actor|actors|actress|actresses|director|directors|president|presidents|minister|ministers|politician|politicians|leader|leaders|expert|experts|specialist|specialists|scientist|scientists|researcher|researchers|candidate|candidates|applicant|applicants|winner|winners|owner|owners|driver|drivers|passenger|passengers|patient|patients|nurse|nurses|officer|officers|soldier|soldiers|farmer|farmers|cook|cooks|chef|chefs|waiter|waiters|guest|guests|visitor|visitors|tourist|tourists|stranger|strangers|someone|somebody|anyone|anybody|everyone|everybody|nobody) which': '$1 who'

# Portuguese word order: adverbs before the subject ("always I…"), verb +
# "very much" + object ("I like very much this"), adjective after the noun
# ("the car red", "a person very intelligent"), "more two days".
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: existence
message: "'%s' follows Portuguese word order. English: adverb after the subject (I always…), object before 'very much' (I like it very much / I really like it), adjective before the noun (the red car), 'two more days'."
level: suggestion
ignorecase: true
nonword: true
tokens:
  - '(?m)(?:^|(?<=[.!?]\s))(?:Always|Never|Sometimes|Usually|Often|Rarely|Seldom|Already|Still)\s+(?:I|we|they|you|he|she|it)\s+(?!am\b|are\b|is\b|was\b|were\b|can\b|could\b|will\b|would\b|should\b|must\b|have\b|has\b|had\b|do\b|does\b|did\b)\w+'
  - '\b(?:like|likes|liked|love|loves|loved|enjoy|enjoys|enjoyed|appreciate|appreciates|appreciated|want|wants|wanted|need|needs|needed|miss|misses|missed|hate|hates|hated|prefer|prefers|preferred)\s+(?:very much|so much|a lot|too much)\s+(?:the|this|that|these|those|my|your|his|her|their|our|its|to\s+\w+|\w+ing)\b'
  - '\b(?:a|an|the|this|that|these|those|my|your|his|her|their|our)\s+(?:person|man|woman|boy|girl|guy|people|student|teacher|friend|colleague|doctor|lawyer|engineer|developer|programmer|designer|manager|boss|professor|child|kid|baby|dog|cat|house|car|book|movie|film|song|place|city|country|restaurant|hotel|room|apartment|company|job|idea|project|problem|question|day|night|week|trip|party)\s+(?:very|so|really|quite|extremely|super|pretty|rather|too|incredibly|really)\s+(?:intelligent|smart|nice|kind|good|bad|beautiful|ugly|big|small|tall|short|old|young|new|rich|poor|happy|sad|funny|serious|strong|weak|fast|slow|hard|easy|difficult|simple|complex|interesting|boring|important|expensive|cheap|famous|popular|dangerous|safe|clean|dirty|quiet|noisy|hot|cold|warm|cool|long|large|huge|tiny|special|strange|weird|normal|common|rare|modern|ancient|clever|stupid|silly|polite|rude|friendly|shy|lazy|busy|free|tired|sick|healthy|hungry|thirsty|angry|calm|nervous|anxious|patient|honest|brave|careful|careless|lucky|creative|talented|educated|professional|experienced|qualified|competent|efficient|productive|helpful|useful|useless|comfortable|convenient|practical|flexible|reliable|responsible|generous|selfish|jealous|proud|humble|confident|insecure|optimistic|pessimistic|realistic|romantic|emotional|sensitive|sensible|reasonable|logical|rational|crazy|mad|wild|dark|bright|light|heavy|thick|thin|fat|slim|fit|delicious|tasty|sweet|sour|bitter|salty|spicy|fresh|dry|wet|smooth|rough|soft|loud|quiet|silent|empty|full|open|closed|public|private|legal|illegal|official|formal|informal|casual|elegant|fancy|plain|traditional|typical|unusual|unique|original|fake|real|true|false|wrong|right|correct|exact|precise|accurate|clear|obvious|hidden|secret|sure|certain|possible|impossible|likely|unlikely|available|ready|late|early|recent|current|previous|next|last|first|final|main|major|minor|basic|advanced|complete|incomplete|perfect|imperfect|excellent|terrible|horrible|awful|wonderful|amazing|fantastic|great|fine|okay|ok)\b'
  - '\b(?:the|a|an|this|that|these|those|my|your|his|her|their|our)\s+(?:car|house|dress|shirt|bag|book|table|chair|door|wall|phone|bike|bicycle|bus|truck|cat|dog|flower|hat|coat|jacket|shoe|shoes|pen|pencil|box|bottle|cup|glass|plate|wine|beer|light|sky|sea|ball|flag|line|bag|sofa|couch|carpet|curtain|curtains|towel|blanket|pillow|sheet|sheets|umbrella|ribbon|paint|ink|hair|eyes|eye|lipstick|nail|nails)\s+(?:red|blue|green|yellow|black|white|gray|grey|brown|pink|purple|orange|golden|silver|dark|light|big|small|little|large|huge|tiny|old|new|beautiful|ugly|cheap|expensive|fast|slow|long|short|tall|wide|narrow|round|square|flat|hot|cold|warm|clean|dirty|empty|full|heavy|wooden|plastic|metal|leather|cotton|silk|striped|dotted|checked|plain|fancy)\s+(?:is|are|was|were|has|have|had|of|that|which|in|on|at|with|for|and|,|\.|$)'
  - '\bmore\s+(?:one|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|fifty|a hundred|\d+)\s+(?:day|days|week|weeks|month|months|year|years|hour|hours|minute|minutes|second|seconds|time|times|person|people|thing|things|item|items|piece|pieces|question|questions|example|examples|step|steps|page|pages|chapter|chapters|episode|episodes|round|rounds|try|tries|attempt|attempts|chance|chances|shot|shots|beer|beers|drink|drinks|coffee|coffees|glass|glasses|bottle|bottles|plate|plates|slice|slices|cup|cups)\b'

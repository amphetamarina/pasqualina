# Calques of Portuguese dar (dar uma olhada, dar erro) where English uses a
# different verb; tense-preserving one-click replacements.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: substitution
message: "English says '%s', not '%s' (dar calque)."
level: warning
ignorecase: true
action:
  name: replace
swap:
  '(give) (a |one |another )?(look|looks)( at| in| on)?': 'take a look$4'
  '(gives) (a |one |another )?(look|looks)( at| in| on)?': 'takes a look$4'
  '(gave) (a |one |another )?(look|looks)( at| in| on)?': 'took a look$4'
  '(given) (a |one |another )?(look|looks)( at| in| on)?': 'taken a look$4'
  '(giving) (a |one |another )?(look|looks)( at| in| on)?': 'taking a look$4'
  '(give) (an? |one )?(error|errors|bug|bugs)': 'throw $2$3'
  '(gives) (an? |one )?(error|errors|bug|bugs)': 'throws $2$3'
  '(gave) (an? |one )?(error|errors|bug|bugs)': 'threw $2$3'
  '(given) (an? |one )?(error|errors|bug|bugs)': 'thrown $2$3'
  '(giving) (an? |one )?(error|errors|bug|bugs)': 'throwing $2$3'
  '(give) (a |one |the first |the next )?steps?': 'take a step'
  '(gives) (a |one |the first |the next )?steps?': 'takes a step'
  '(gave) (a |one |the first |the next )?steps?': 'took a step'
  '(given) (a |one |the first |the next )?steps?': 'taken a step'
  '(giving) (a |one |the first |the next )?steps?': 'taking a step'

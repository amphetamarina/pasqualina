# Article calques from Portuguese (o Brasil, o meu, os dois). Exact fixes
# only; the rephrases live in ArticlesPhrases.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: substitution
message: "English says '%s', not '%s' (Portuguese article)."
level: warning
ignorecase: true
action:
  name: replace
swap:
  'the (my|your|his|her|their|our|its)': '$1'
  'the both( of)?': 'both$1'
  '(in|on|at|during) the (last|next|coming|previous) (week|month|year|weekend|semester|summer|winter|spring|autumn|fall|monday|tuesday|wednesday|thursday|friday|saturday|sunday|time|christmas|easter|carnival|holiday|holidays|vacation|vacations)(?!\s+of\b)': '$2 $3'
  '(an|a) other': 'another'
  'others (people|persons|things|countries|cities|places|options|ways|times|days|students|companies|languages|cultures|reasons|problems|questions|examples|ideas|projects|products|services|areas|types|kinds|forms|cases|situations|aspects|factors|elements|items|points|topics|subjects|activities|tasks|words|names|books|movies|films|songs|games|sports|teams|players|friends|colleagues|members|users|customers|clients|employees|workers)': 'other $1'
  'the (\d+)\s?(%|percent|per cent) ': '$1$2 '
  '(in|to|from|of|about|visit|visited|visiting|love|loves|loved|live in|lives in|lived in|living in|go to|went to|going to|come from|came from|comes from|arrive in|arrived in|move to|moved to|back to|return to|returned to|travel to|traveled to|travelled to|left|leave|leaving) the (brazil|portugal|france|germany|italy|spain|argentina|chile|uruguay|paraguay|bolivia|peru|colombia|venezuela|mexico|canada|japan|china|india|russia|england|scotland|ireland|wales|europe|africa|asia|america|latin america|south america|north america|oceania|australia|angola|mozambique|cape verde)': '$1 $2'

# Misspellings shaped by Portuguese orthography: no doubled consonants
# (except rr/ss), -ável → -able, -ência → -ence, ph/ch/th/y → f/c/t/i,
# and cognates spelled the Portuguese way. Harper's SpellCheck usually
# catches these too; this rule adds the direct fix and the reason, and it
# stays at suggestion level so Harper keeps the primary say.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: substitution
message: "Use '%s': '%s' is spelled the Portuguese way (doubled consonant / cognate ending)."
level: suggestion
ignorecase: true
action:
  name: replace
swap:
  adress: address
  adresses: addresses
  comunication: communication
  comunicate: communicate
  comunity: community
  recomend: recommend
  recomended: recommended

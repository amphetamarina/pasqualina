# Portuguese number and date formatting: decimal comma (3,14), thousands
# point (1.000.000), day/month dates (12/03). English uses 3.14, 1,000,000,
# and dates that name the month to avoid the dd/mm vs mm/dd trap.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: existence
message: "'%s' looks like Portuguese number/date formatting. English: decimal point (3.14), thousands comma (1,000,000), and dates with the month spelled out (12 March 2026 / March 12, 2026)."
level: suggestion
nonword: true
tokens:
  - '\b\d+,\d{1,2}\b(?:[^\d,]|$)'
  - '\b\d{1,3}(?:\.\d{3}){1,}\b'
  - '\b\d{1,2}/\d{1,2}/\d{2,4}\b'
  - 'R\$\s?\d'

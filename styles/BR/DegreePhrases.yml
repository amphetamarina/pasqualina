# Degree calques whose English fix is a rephrase (comparative morphology,
# adverb form); the message names the pattern. See docs/03.
extends: existence
message: "'%s' is a Portuguese degree calque. English rephrases it: '-er/-est' (mais velho -> older), 'well' (fala bem -> speaks well), 'many + plural', 'more and more' (cada vez mais)."
level: warning
ignorecase: true
nonword: true

# States built with Portuguese light verbs (ter fome, estar com sono)
# where English uses be + adjective. Anchored per grammatical person so each
# replacement is an exact one-click fix.
# Catalogue with sources: docs/03-brazilian-english-mistakes.md
extends: substitution
message: "English says '%s', not '%s' (ter/estar com + state)."
level: warning
ignorecase: true
action:
  name: replace
swap:
  '(I) (?:have|''ve) (?:much |a lot of |so much |too much )?hunger': '$1 am hungry'
  '(you|we|they) (?:have|''ve) (?:much |a lot of |so much |too much )?hunger': '$1 are hungry'
  '(he|she|it) has (?:much |a lot of |so much |too much )?hunger': '$1 is hungry'
  '(am|is|are|was|were) with (?:much |a lot of |so much |too much )?hunger': '$1 hungry'
  '(I) (?:have|''ve) (?:much |a lot of |so much |too much )?thirst': '$1 am thirsty'
  '(you|we|they) (?:have|''ve) (?:much |a lot of |so much |too much )?thirst': '$1 are thirsty'
  '(he|she|it) has (?:much |a lot of |so much |too much )?thirst': '$1 is thirsty'
  '(am|is|are|was|were) with (?:much |a lot of |so much |too much )?thirst': '$1 thirsty'
  '(I) (?:have|''ve) (?:much |a lot of |so much |too much )?sleep(?!\s+\w)': '$1 am sleepy'
  '(you|we|they) (?:have|''ve) (?:much |a lot of |so much |too much )?sleep(?!\s+\w)': '$1 are sleepy'
